<!doctype html>
<!-- Stellio plugin « G-code viewer » — GNU AGPL v3 or later — https://github.com/stellio-app/stellio-plugins -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>G-code viewer</title>
<style>
  :root { --bg: var(--st-bg, #1a1d23); --panel: var(--st-panel, #22262e); --card: var(--st-card, #2d3240); --hover: var(--st-hover, #363c4a); --text: var(--st-text, #e8e9eb); --muted: var(--st-muted, #9ca0ab); --border: var(--st-border, #363c4a); --accent: var(--st-accent, #4ea1d3); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; display: flex; }
  button, input, select { font: inherit; color: var(--text); }
  /* liste des fichiers */
  #files { width: 250px; flex: none; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  #files.off { display: none; }
  #stage.drag::after { content: attr(data-drop); position: absolute; inset: 8px; border: 2px dashed var(--accent); border-radius: 14px; display: grid; place-items: center; font-size: 16px; background: color-mix(in srgb, var(--bg) 80%, transparent); pointer-events: none; z-index: 9; }
  #pick { width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; }
  #q { margin: 10px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); }
  #list { overflow: auto; flex: 1; padding: 0 8px 10px; }
  .item { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .item:hover { background: var(--card); }
  .item.on { background: var(--accent); color: #fff; }
  .item span, .item small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { color: var(--muted); }
  .item.on small { color: rgba(255,255,255,.82); }
  /* scène */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #stage { flex: 1; min-height: 0; position: relative; background: var(--bg); touch-action: none; }
  canvas#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  canvas#gl:active { cursor: grabbing; }
  .ov { position: absolute; background: color-mix(in srgb, var(--panel) 90%, transparent); border: 1px solid var(--border); border-radius: 10px; padding: 6px; backdrop-filter: blur(4px); }
  .ov.row { display: flex; gap: 4px; align-items: center; }
  .b { border: 1px solid var(--border); background: var(--card); border-radius: 7px; padding: 5px 10px; cursor: pointer; white-space: nowrap; }
  .b:hover { border-color: var(--accent); }
  .b.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  #views { top: 10px; left: 10px; }
  #opts { top: 10px; right: 64px; width: 210px; padding: 8px 10px; max-height: calc(100% - 24px); overflow: auto; }
  #opts.off .body { display: none; }
  #opts h4 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); display: flex; justify-content: space-between; cursor: pointer; }
  #opts label { display: flex; gap: 7px; align-items: center; padding: 3px 0; color: var(--text); }
  #opts .sel, #opts .rng { width: 100%; margin: 3px 0 6px; }
  #opts select { width: 100%; padding: 5px 6px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); margin: 3px 0 6px; }
  #opts input[type=range], #moves, .vs input { accent-color: var(--accent); }
  #legend { display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--muted); }
  #legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  #lay { top: 10px; right: 10px; bottom: 10px; width: 46px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #lay .vs { flex: 1; display: flex; gap: 2px; min-height: 0; }
  #lay input[type=range] { writing-mode: vertical-lr; direction: rtl; width: 18px; height: 100%; margin: 0; accent-color: var(--accent); }
  #lay small { color: var(--muted); font-size: 11px; text-align: center; line-height: 1.15; }
  #info { left: 10px; bottom: 10px; font-size: 12px; max-width: 460px; font-family: ui-monospace, Menlo, Consolas, monospace; line-height: 1.5; }
  #info .k { color: var(--muted); }
  #code { margin-top: 4px; color: var(--muted); white-space: pre; overflow: hidden; text-overflow: ellipsis; }
  #code b { color: var(--text); font-weight: 600; }
  #msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 24px; pointer-events: none; }
  .bar { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--border); background: var(--panel); }
  #moves { flex: 1; min-width: 100px; }
  .bar select { padding: 5px 6px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg); }
  .stats { display: flex; gap: 16px; flex-wrap: wrap; padding: 6px 12px; color: var(--muted); font-size: 12px; background: var(--panel); border-top: 1px solid var(--border); }
  .stats b { color: var(--text); font-weight: 600; }
  @media (max-width: 800px) { #files { position: absolute; z-index: 5; inset: 0 auto 0 0; width: 78%; } #opts { right: 62px; width: 180px; } #info { max-width: 60%; } }
</style>
</head>

    if (ids.length >= 2) { var a = ptrs[ids[0]], b = ptrs[ids[1]], dd = Math.hypot(a.x - b.x, a.y - b.y); if (lastPinch) cam.dist = Math.max(15, Math.min(4000, cam.dist * lastPinch / dd)); lastPinch = dd; draw(); return; }
    if (p.b === 2 || p.s) { var k = cam.dist * 0.0016, sy = Math.sin(cam.yaw), cy = Math.cos(cam.yaw); cam.tx += (dx * sy - dy * cy * Math.sin(cam.pitch)) * k; cam.ty += (-dx * cy - dy * sy * Math.sin(cam.pitch)) * k; cam.tz += dy * Math.cos(cam.pitch) * k; }
    else { cam.yaw -= dx * 0.006; cam.pitch = Math.max(-1.5, Math.min(1.5, cam.pitch + dy * 0.006)); }
    draw();
  });
  cv.addEventListener('wheel', function (e) { e.preventDefault(); cam.dist = Math.max(15, Math.min(4000, cam.dist * Math.exp(e.deltaY * 0.0012))); draw(); }, { passive: false });
  window.addEventListener('resize', draw);

  /* ───────── Fichiers ───────── */
  function renderList() {
    var q = $('q').value.trim().toLowerCase(), box = $('list'); box.textContent = '';
    files.filter(function (f) { return !q || f.name.toLowerCase().indexOf(q) >= 0; }).forEach(function (f) {
      var b = document.createElement('button'); b.className = 'item' + (cur && cur.id === f.id ? ' on' : ''); b.type = 'button'; b.title = f.name; var nm = document.createElement('span'); nm.textContent = f.name; b.appendChild(nm);
      var s = document.createElement('small'); s.textContent = fmt(f.size || 0) + (f.project_name ? ' · ' + f.project_name : ''); b.appendChild(s); b.onclick = function () { open(f); }; box.appendChild(b);
    });
  }
  function load(f, getText) {
    stop(); cur = f; M = null; var my = ++loadId; renderList(); msg(L.load); stats(); info(); draw();
    getText().then(function (t) { text = t; return parse(t, function (p) { if (my === loadId) msg(L.parse + Math.round(p * 100) + ' %'); }); }).then(function (m) {
      if (my !== loadId) return; if (!m) { msg(L.empty); return; }
      M = m; msg(''); S.lo = 1; fitCam(); buildModelSets(); stats(); setHi(M.layerZ.length); if (window.innerWidth < 800) $('files').classList.add('off');
    }).catch(function (e) { msg(L.err + e.message); });
  }
  function open(f) { load(f, function () { return window.stellio.api('/api/projects/gcodes/' + f.id + '/download', 'text'); }); }
  function openLocal(file) {
    if (!file) return; var f = { id: 'pc:' + file.name, name: file.name, size: file.size, project_name: '💻', local: true };
    files = files.filter(function (x) { return !x.local || x.id !== f.id; }); files.unshift(f);
    load(f, function () { return new Promise(function (ok, ko) { var r = new FileReader(); r.onload = function () { ok(String(r.result)); }; r.onerror = function () { ko(new Error(file.name)); }; r.readAsText(file); }); });
  }
  $('pick').onclick = function () { $('fin').click(); };
  $('fin').onchange = function () { openLocal(this.files && this.files[0]); this.value = ''; };
  var st = $('stage');
  ['dragenter', 'dragover'].forEach(function (n) { st.addEventListener(n, function (e) { e.preventDefault(); st.classList.add('drag'); }); });
  ['dragleave', 'drop'].forEach(function (n) { st.addEventListener(n, function (e) { e.preventDefault(); st.classList.remove('drag'); if (n === 'drop' && e.dataTransfer && e.dataTransfer.files[0]) openLocal(e.dataTransfer.files[0]); }); });
  function setLang() {
    L = T[(window.stellio && window.stellio.lang || 'en').slice(0, 2)] || T.en; $('q').placeholder = L.search; $('pick').textContent = '📂 ' + L.openpc; $('stage').setAttribute('data-drop', L.drop);
    $('otitle').firstChild.textContent = L.opts; $('vtop').textContent = L.top; $('vfront').textContent = L.front; $('vside').textContent = L.side;
    $('loext').textContent = L.ext; $('lotrav').textContent = L.trav; $('loret').textContent = L.ret; $('lobed').textContent = L.bed; $('loaxes').textContent = L.axes; $('lcol').textContent = L.color; $('lbedsel').textContent = L.bedsel; $('lw').textContent = L.width;
    var oc = $('ocol'), v = oc.value || 'type'; oc.textContent = '';
    [['type', L.ctype], ['layer', L.clayer], ['speed', L.cspeed], ['flow', L.cflow], ['uni', L.cuni]].forEach(function (p) { var o = document.createElement('option'); o.value = p[0]; o.textContent = p[1]; oc.appendChild(o); }); oc.value = v;
    legend(); if (!M) msg(files.length ? L.pick : L.none); stats(); info();
  }
  function fillBeds(printers) {
    var sel = $('obedsel'); sel.textContent = ''; var seen = {};
    function add(label, x, y) { var k = x + 'x' + y; if (seen[k]) return; seen[k] = 1; var o = document.createElement('option'); o.value = k; o.textContent = label + ' (' + x + '×' + y + ')'; sel.appendChild(o); }
    (Array.isArray(printers) ? printers : printers && printers.printers || []).forEach(function (p) { var c = p.config || p || {}, x = Math.round(+c.bed_x), y = Math.round(+c.bed_y); if (x > 0 && y > 0) add(p.name, x, y); });
    [[180, 180], [220, 220], [256, 256], [300, 300], [350, 350]].forEach(function (b) { add(L.def, b[0], b[1]); });
    sel.selectedIndex = 0; var v = sel.value.split('x'); bed = { x: +v[0], y: +v[1] }; buildBed(); fitCam(); draw();
  }
  function start() {
    try { initGL(); } catch (e) { msg(L.nogl); return; }
    setLang(); fillBeds([]); $('q').oninput = renderList;
    window.stellio.api('/api/printers').then(fillBeds, function () { /* facultatif */ });
    window.stellio.api('/api/gcodes?limit=200').then(function (d) { files = d.gcodes || []; renderList(); if (!M) msg(files.length ? L.pick : L.none); }).catch(function (e) { msg(L.err + e.message); });
  }
  if (!gl) { msg(T.en.nogl); } else if (window.stellio && window.stellio.ready) start(); else document.addEventListener('stellio-ready', start);
})();
