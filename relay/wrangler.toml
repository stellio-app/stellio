name = "stellio-issue-relay"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
GITHUB_REPO = "stellio-app/stellio"

# Limitation : 5 demandes par minute et par adresse IP (à vérifier dans la doc Cloudflare « Workers Rate Limiting »
# si la syntaxe a évolué)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
