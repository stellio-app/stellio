name: Build, sign and release Stellio

on:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'index.html'
      - 'script.js'
      - 'style.css'
      - 'launcher.py'
      - 'check_deps.py'
      - 'requirements.txt'
      - 'stellio-setup.iss'
      - 'assets/**'
      - 'languages/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build uniquement, sans publier de release'
        type: boolean
        default: false

permissions:
  contents: write  

jobs:
  # ──────────────────────────────────────────────────────────────────────
  # 1. Détecte la version courante et decide si une release est necessaire
  # ──────────────────────────────────────────────────────────────────────
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version and compare to existing tags
        id: check
        run: |
          VERSION=$(grep -E '^CURRENT_VERSION' main.py | head -1 | sed -E "s/^CURRENT_VERSION[[:space:]]*=[[:space:]]*//; s/[\"']//g" | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "CURRENT_VERSION introuvable dans main.py"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version detectee : $VERSION"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Mode dry_run : build uniquement, pas de release."
          elif git ls-remote --tags origin | grep -q "refs/tags/v$VERSION\$"; then
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "Le tag v$VERSION existe deja — rien a publier (CURRENT_VERSION pas modifiee)."
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version : v$VERSION va etre construite et publiee."
          fi

  # ──────────────────────────────────────────────────────────────────────
  # 2. Build (tourne toujours, meme en dry_run, pour valider le code)
  # ──────────────────────────────────────────────────────────────────────
  build:
    needs: check-version
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv venv
          venv\Scripts\python.exe -m pip install --upgrade pip
          venv\Scripts\python.exe -m pip install --upgrade -r requirements.txt
          venv\Scripts\python.exe -m pip install pyinstaller

      - name: Check dependencies (fix)
        run: venv\Scripts\python.exe check_deps.py --fix

      - name: Final dependency check (no fix)
        run: venv\Scripts\python.exe check_deps.py

      - name: Build with PyInstaller
        run: |
          venv\Scripts\python.exe -m PyInstaller `
            --name "Stellio" `
            --onedir `
            --windowed `
            --noconfirm `
            --clean `
            --hidden-import sqlite3 `
            --hidden-import ssl `
            --hidden-import hashlib `
            --hidden-import tkinter `
            --hidden-import tkinter.ttk `
            --collect-all tkinter `
            --collect-all webview `
            --collect-all trimesh `
            --collect-all pyrender `
            --collect-all imageio `
            --collect-all OpenGL `
            --collect-all numpy `
            --collect-all PIL `
            --collect-all matplotlib `
            --collect-all mpl_toolkits `
            --collect-all fast_simplification `
            --collect-all pymeshfix `
            --collect-all shapely `
            --collect-all rectpack `
            --collect-all smbprotocol `
            --collect-all smbclient `
            --collect-all paho `
            --collect-all cryptography `
            --collect-all rarfile `
            --collect-all py7zr `
            --collect-all defusedxml `
            --collect-all qrcode `
            --collect-all websocket `
            --collect-all flashforge `
            --collect-all waitress `
            --collect-all flask `
            --collect-all werkzeug `
            --copy-metadata imageio `
            --copy-metadata pyrender `
            --copy-metadata trimesh `
            --copy-metadata Pillow `
            --copy-metadata PyOpenGL `
            --copy-metadata numpy `
            --icon="assets\logo-nom-stellio.ico" "launcher.py"

      - name: Verify PyInstaller output exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\Stellio\Stellio.exe")) {
            throw "dist\Stellio\Stellio.exe introuvable - la compilation a echoue"
          }

      - name: Copy patchable files into dist\Stellio\app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist\Stellio\app" | Out-Null
          Copy-Item "main.py"          "dist\Stellio\app\main.py"
          Copy-Item "check_deps.py"    "dist\Stellio\app\check_deps.py"
          Copy-Item "index.html"       "dist\Stellio\app\index.html"
          Copy-Item "script.js"        "dist\Stellio\app\script.js"
          Copy-Item "style.css"        "dist\Stellio\app\style.css"
          Copy-Item -Recurse "assets"    "dist\Stellio\app\assets"
          Copy-Item -Recurse "languages" "dist\Stellio\app\languages"
          if (Test-Path "bin") { Copy-Item -Recurse "bin" "dist\Stellio\app\bin" }

          foreach ($f in @("main.py","check_deps.py","index.html","script.js","style.css")) {
            if (-not (Test-Path "dist\Stellio\app\$f")) {
              throw "Echec de copie : dist\Stellio\app\$f"
            }
          }

      - name: Create patch ZIP for auto-updater
        shell: pwsh
        run: |
          $zipName = "Stellio-v${{ needs.check-version.outputs.version }}-patch.zip"
          Compress-Archive -Path "dist\Stellio\app\*" -DestinationPath $zipName -Force
          if (-not (Test-Path $zipName)) { throw "Echec de creation du ZIP de patch." }
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding ascii "$zipName.sha256"

      - name: Upload patch ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellio-patch-zip
          path: |
            Stellio-v${{ needs.check-version.outputs.version }}-patch.zip
            Stellio-v${{ needs.check-version.outputs.version }}-patch.zip.sha256

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DMyAppVersion=${{ needs.check-version.outputs.version }}" `
            "stellio-setup.iss"

      - name: Upload unsigned installer artifact
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: stellio-installer-unsigned
          path: output\Stellio-Setup-${{ needs.check-version.outputs.version }}.exe

  # ──────────────────────────────────────────────────────────────────────
  # 3. Publication en DRAFT (Brouillon) pour édition manuelle
  # ──────────────────────────────────────────────────────────────────────
  release:
    needs: [check-version, build]
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: stellio-installer-unsigned
          path: release-files

      - name: Download patch ZIP artifact
        uses: actions/download-artifact@v4
        with:
          name: stellio-patch-zip
          path: release-files

      - name: Compute SHA256 checksum of installer
        shell: pwsh
        run: |
          $file = Get-ChildItem "release-files\*.exe" | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $file.FullName).Hash.ToLower()
          "$hash  $($file.Name)" | Out-File -Encoding ascii "release-files\$($file.Name).sha256"

      - name: Create GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.version }}
          name: Stellio v${{ needs.check-version.outputs.version }}
          draft: true                      # ← CRUCIAL : Crée la release en brouillon
          generate_release_notes: false    # ← Désactive les notes auto pour que tu rédiges toi-même
          files: |
            release-files/*.exe
            release-files/*.sha256
            release-files/*.zip

  # ──────────────────────────────────────────────────────────────────────
  # 4. Signature + publication AVEC SignPath (DÉSACTIVÉ pour l'instant)
  # 
  # POUR RÉACTIVER LA SIGNATURE :
