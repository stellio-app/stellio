name: wiki
# Met à jour le wiki GitHub (8 langues + captures + nouveautés) à chaque push concerné et à chaque release.
on:
  push:
    branches: [main]
    paths:
      - 'docs/wiki/**'
      - 'changelog.json'
      - 'tools/build_wiki.py'
      - '.github/workflows/wiki.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Contrôle de la structure (8 langues)
        run: python tools/build_wiki.py --check
      - name: Génération
        run: python tools/build_wiki.py --out wiki-out
      - name: Publication sur le wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          set -e
          HOST="${SERVER#https://}"
          if ! git clone "https://x-access-token:${TOKEN}@${HOST}/${REPO}.wiki.git" wiki-repo 2>/dev/null; then
            echo "::warning::Le wiki n'est pas encore initialisé : créez une première page (onglet Wiki → Create the first page), puis relancez ce workflow."
            exit 0
          fi
          rsync -a --delete --exclude '.git' wiki-out/ wiki-repo/
          cd wiki-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki déjà à jour."
          else
            git commit -m "Wiki : mise à jour automatique (${GITHUB_SHA::7})"
            git push
          fi
